services:
  - type: web
    name: wowstampa-reviews-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SHOPIFY_APP_URL
        value: https://wowstampa-reviews-app.onrender.com
      - key: SCOPES
        value: read_products
      - key: SHOPIFY_API_KEY
        value: 7bf035fe3beef0643dd5bffdc66ab8ca
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
